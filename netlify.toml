[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/empieza"
  to = "/empieza.html"
  status = 200

[[redirects]]
  from = "/planes"
  to = "/planes.html"
  status = 200

# --- landings (generado por generar-landings.js) ---
[[redirects]]
  from = "/fontaneros"
  to = "/fontaneros.html"
  status = 200
[[redirects]]
  from = "/reformas"
  to = "/reformas.html"
  status = 200
[[redirects]]
  from = "/dentistas"
  to = "/dentistas.html"
  status = 200
[[redirects]]
  from = "/abogados"
  to = "/abogados.html"
  status = 200
# --- fin landings ---
